<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iWheb Auth Client Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background: #007cba;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background: #005a87;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .section {
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .section h3 {
            margin-top: 0;
        }
        .response {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 10px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            min-height: 100px;
            overflow-y: auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <h1>🚀 iWheb Auth Client Demo</h1>
    <p>Test all iWheb Authentication Service endpoints</p>

    <!-- Configuration Section -->
    <div class="section">
        <h3>⚙️ Configuration</h3>
        <div class="form-group">
            <label for="baseUrl">API Base URL:</label>
            <input type="text" id="baseUrl" value="https://api.example.com" placeholder="http://localhost:8080">
        </div>
        <div class="form-group">
            <label for="apiKey">API Key:</label>
            <input type="text" id="apiKey" placeholder="your-api-key">
        </div>
        <div class="form-group">
            <label for="useSSL">Connection:</label>
            <select id="useSSL">
                <option value="true">HTTPS (SSL)</option>
                <option value="false">HTTP (no SSL)</option>
            </select>
        </div>
        <button onclick="initializeClient()">Initialize Client</button>
        <div id="clientStatus"></div>
    </div>

    <div class="grid">
        <!-- Authentication Section -->
        <div class="section">
            <h3>🔐 Authentication</h3>
            
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="user@example.com">
            </div>
            <button onclick="login()" id="loginBtn" disabled>Start Login</button>
            
            <div class="form-group" style="margin-top: 15px;">
                <label for="code">6-Digit Code:</label>
                <input type="text" id="code" placeholder="123456" maxlength="6">
            </div>
            <div class="form-group">
                <label for="sessionId">Session ID:</label>
                <input type="text" id="sessionId" placeholder="session-id-from-login">
            </div>
            <button onclick="validate()" id="validateBtn" disabled>Validate Code</button>
            <button onclick="logout()" id="logoutBtn" disabled>Logout</button>
        </div>

        <!-- Session Management Section -->
        <div class="section">
            <h3>🕒 Session Management</h3>
            
            <div class="form-group">
                <label for="sessionIdForCheck">Session ID:</label>
                <input type="text" id="sessionIdForCheck" placeholder="session-id">
            </div>
            <button onclick="checkSession()" id="checkBtn" disabled>Check Session</button>
            <button onclick="touchSession()" id="touchBtn" disabled>Refresh Session</button>
            <button onclick="isSessionActive()" id="activeBtn" disabled>Is Active?</button>
            
            <div class="form-group" style="margin-top: 15px;">
                <label for="targetApiKey">Target API Key (for delegation):</label>
                <input type="text" id="targetApiKey" placeholder="target-api-key">
            </div>
            <button onclick="createDelegatedSession()" id="delegateBtn" disabled>Create Delegated Session</button>
        </div>
    </div>

    <!-- User Data Section -->
    <div class="section">
        <h3>👤 User Data</h3>
        
        <div class="form-group">
            <label for="sessionIdForUser">Session ID:</label>
            <input type="text" id="sessionIdForUser" placeholder="session-id">
        </div>
        <button onclick="getUserInfo()" id="userInfoBtn" disabled>Get User Info</button>
        <button onclick="getUserToken()" id="userTokenBtn" disabled>Get User Token</button>
    </div>

    <!-- Response Section -->
    <div class="section">
        <h3>📋 Response</h3>
        <div id="status"></div>
        <div class="response" id="response">Ready to test...</div>
        <button onclick="clearResponse()">Clear Response</button>
    </div>

    <!-- Include the iWheb Auth Client -->
    <script src="iwheb-auth.js"></script>
    
    <script>
        let client = null;

        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function showResponse(data) {
            const responseDiv = document.getElementById('response');
            const timestamp = new Date().toISOString();
            const formattedResponse = `[${timestamp}]\n${JSON.stringify(data, null, 2)}`;
            responseDiv.textContent = formattedResponse;
        }

        function clearResponse() {
            document.getElementById('response').textContent = 'Response cleared...';
            document.getElementById('status').textContent = '';
            document.getElementById('status').className = '';
        }

        function enableButtons(enabled) {
            const buttons = ['loginBtn', 'validateBtn', 'logoutBtn', 'checkBtn', 'touchBtn', 'activeBtn', 'delegateBtn', 'userInfoBtn', 'userTokenBtn'];
            buttons.forEach(id => {
                document.getElementById(id).disabled = !enabled;
            });
        }

        function initializeClient() {
            const baseUrl = document.getElementById('baseUrl').value.trim();
            const apiKey = document.getElementById('apiKey').value.trim();
            const useSSL = document.getElementById('useSSL').value === 'true';

            if (!baseUrl || !apiKey) {
                showStatus('Please enter both Base URL and API Key', 'error');
                return;
            }

            try {
                client = new IWebAuthClient({
                    baseUrl: baseUrl,
                    apiKey: apiKey,
                    useSSL: useSSL
                });

                const protocol = useSSL ? 'HTTPS' : 'HTTP';
                showStatus(`Client initialized successfully (${protocol})`, 'success');
                document.getElementById('clientStatus').innerHTML = `<div class="status success">✅ Connected to: ${client.httpClient.baseUrl}</div>`;
                enableButtons(true);
            } catch (error) {
                showStatus(`Failed to initialize client: ${error.message}`, 'error');
                enableButtons(false);
            }
        }

        async function login() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showStatus('Please enter an email address', 'error');
                return;
            }

            try {
                showStatus('Sending login request...', 'info');
                const response = await client.login(email);
                showResponse(response);
                showStatus('Login successful! Check your email for the code.', 'success');
                
                // Auto-fill session ID
                if (response.data && response.data.session_id) {
                    document.getElementById('sessionId').value = response.data.session_id;
                    document.getElementById('sessionIdForCheck').value = response.data.session_id;
                    document.getElementById('sessionIdForUser').value = response.data.session_id;
                }
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Login failed: ${error.message}`, 'error');
            }
        }

        async function validate() {
            const sessionId = document.getElementById('sessionId').value.trim();
            const code = document.getElementById('code').value.trim();

            if (!sessionId || !code) {
                showStatus('Please enter both Session ID and Code', 'error');
                return;
            }

            try {
                showStatus('Validating code...', 'info');
                const response = await client.validate(sessionId, code);
                showResponse(response);
                showStatus('Code validated successfully!', 'success');
                
                // Update session IDs with new one
                if (response.data && response.data.session_id) {
                    document.getElementById('sessionId').value = response.data.session_id;
                    document.getElementById('sessionIdForCheck').value = response.data.session_id;
                    document.getElementById('sessionIdForUser').value = response.data.session_id;
                }
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Validation failed: ${error.message}`, 'error');
            }
        }

        async function checkSession() {
            const sessionId = document.getElementById('sessionIdForCheck').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Checking session...', 'info');
                const response = await client.checkSession(sessionId);
                showResponse(response);
                showStatus('Session check completed', 'success');
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Session check failed: ${error.message}`, 'error');
            }
        }

        async function touchSession() {
            const sessionId = document.getElementById('sessionIdForCheck').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Refreshing session...', 'info');
                const response = await client.touchSession(sessionId);
                showResponse(response);
                showStatus('Session refreshed successfully', 'success');
                
                // Update with new session ID
                if (response.data && response.data.session_id) {
                    document.getElementById('sessionId').value = response.data.session_id;
                    document.getElementById('sessionIdForCheck').value = response.data.session_id;
                    document.getElementById('sessionIdForUser').value = response.data.session_id;
                }
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Session refresh failed: ${error.message}`, 'error');
            }
        }

        async function isSessionActive() {
            const sessionId = document.getElementById('sessionIdForCheck').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Checking if session is active...', 'info');
                const isActive = await client.isSessionActive(sessionId);
                showResponse({active: isActive});
                showStatus(`Session is ${isActive ? 'active' : 'inactive'}`, isActive ? 'success' : 'error');
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Session active check failed: ${error.message}`, 'error');
            }
        }

        async function createDelegatedSession() {
            const sessionId = document.getElementById('sessionIdForCheck').value.trim();
            const targetApiKey = document.getElementById('targetApiKey').value.trim();
            
            if (!sessionId || !targetApiKey) {
                showStatus('Please enter both Session ID and Target API Key', 'error');
                return;
            }

            try {
                showStatus('Creating delegated session...', 'info');
                const response = await client.createDelegatedSession(sessionId, targetApiKey);
                showResponse(response);
                showStatus('Delegated session created successfully', 'success');
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Delegated session creation failed: ${error.message}`, 'error');
            }
        }

        async function logout() {
            const sessionId = document.getElementById('sessionId').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Logging out...', 'info');
                const response = await client.logout(sessionId);
                showResponse(response);
                showStatus('Logout successful', 'success');
                
                // Clear session IDs
                document.getElementById('sessionId').value = '';
                document.getElementById('sessionIdForCheck').value = '';
                document.getElementById('sessionIdForUser').value = '';
                document.getElementById('code').value = '';
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Logout failed: ${error.message}`, 'error');
            }
        }

        async function getUserInfo() {
            const sessionId = document.getElementById('sessionIdForUser').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Getting user info...', 'info');
                const response = await client.getUserInfo(sessionId);
                showResponse(response);
                showStatus('User info retrieved successfully', 'success');
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Get user info failed: ${error.message}`, 'error');
            }
        }

        async function getUserToken() {
            const sessionId = document.getElementById('sessionIdForUser').value.trim();
            if (!sessionId) {
                showStatus('Please enter a Session ID', 'error');
                return;
            }

            try {
                showStatus('Getting user token...', 'info');
                const response = await client.getUserToken(sessionId);
                showResponse(response);
                showStatus('User token retrieved successfully', 'success');
            } catch (error) {
                showResponse({error: error.message});
                showStatus(`Get user token failed: ${error.message}`, 'error');
            }
        }

        // Initialize on page load
        showStatus('Enter your API configuration and click "Initialize Client" to start', 'info');
    </script>
</body>
</html>
